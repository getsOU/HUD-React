name: Build and verify HUD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Verify official public SDK files
        run: npm run sdk:verify
      - name: Lint
        run: npm run lint
      - name: Verify original icon layout
        shell: pwsh
        run: ./scripts/Generate-IconLayout.ps1 -Check
      - name: Test
        run: npm test
      - name: Build and validate installable package
        run: npm run package
      - name: Verify release guards without publishing
        shell: pwsh
        run: |
          $manifest = Get-Content hud.json -Raw | ConvertFrom-Json
          ./scripts/Test-ReleaseGuards.ps1 -ExpectedId sou-basic-react -ManifestPath hud.json -PackagePath "artifacts/$($manifest.id)-$($manifest.version).souhud"
      - name: Retain package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sou-basic-react
          path: |
            artifacts/*.souhud
            artifacts/*.sha256
          if-no-files-found: error

  release:
    if: github.repository == 'getsOU/sOU-HUD-React' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this build's verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sou-basic-react
          path: release-artifacts
      - name: Verify and publish immutable release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-Release.ps1 -ExpectedId sou-basic-react -ManifestPath hud.json
